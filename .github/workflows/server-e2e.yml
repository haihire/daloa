name: Server E2E (Manual)

# Purpose:
# - Keep this as a manual fallback/regression reproducer.
# - PR automatic E2E runs are unified in .github/workflows/pr-ci.yml.

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        # schema.prisma가 vector 타입(RAG 임베딩)을 참조하므로 pgvector 포함 이미지 필요.
        # 순정 postgres면 prisma db push가 'type "vector" does not exist'로 실패한다.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lost_ark
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d lost_ark"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/lost_ark
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      GEMINI_API_KEY: ""
      YOUTUBE_API_KEY: ""
      LOSTARK_API_KEY: ""
      KAKAO_REST_API_KEY: ""
      KAKAO_REFRESH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      # 이미지에 pgvector가 들어있어도 확장은 DB마다 따로 활성화해야 vector 타입이 생긴다.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: testpass
        run: psql -h 127.0.0.1 -U testuser -d lost_ark -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup database schema
        working-directory: server
        run: pnpm exec prisma db push

      - name: Run server E2E
        working-directory: server
        run: pnpm test:e2e
